[package]
# Port of Simple Backups 1.21-4.0.30 (ChaoticTrials/SimpleBackups, Apache-2.0) for
# Minecraft Java 1.21.1 NeoForge; the port targets Horizon 26.3 at the pin in
# horizon-mod.toml. Clean-room Rust rewrite from the mod's behaviour (notes.md);
# local-only until publishing is approved, and the outbound licence needs the
# maintainer's review (LICENSE-NOTICE.md).
#
# Cargo's name and version are not the mod's identity: horizon-mod.toml is.
name = "simplebackups"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Simple Backups for Horizon: scheduled world backups with retention"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command (the
# launcher builds against its own copy of the same build). Any other registry dependency must be
# pinned with `horizon-launcher native-lock .` before building; this port adds none, so the zip
# archive is written by `src/zip.rs` with nothing but std.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }

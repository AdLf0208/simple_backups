id = "simplebackups"
name = "Simple Backups"
version = "0.2.4"
description = """Scheduled, on-disk backups of the whole world, with retention. A backup saves the open
world, then a worker thread walks the world folder into a .zip.part, publishes it as a .zip and
prunes the oldest ones down to keep. A copy a save cycle overlapped is thrown away and redone. The
schedule is a game-tick interval or a wall-clock minute interval; the commands are
/simplebackups backup|status|list and /simplebackups adopt <file> at permission level 2. Retention
deletes only archives the port marked itself, or a marker-less one an operator explicitly adopted."""
authors = ["ChaoticTrials", "AdLf0208"]
license = "Apache-2.0"
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins,
# beside data/ and assets/. The id is the resource namespace and the only identity.
api = "0.2"
# "both" is the installation side, not the hook's: an integrated server belongs to the client
# installation, so single player and a LAN host need both. A dedicated server is "server".
side = "both"
# The one shared value every manifest carries ("May add blocks, items, mob effects and entity
# types"). Simple Backups registers nothing, and the manifest's shape is not negotiable.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

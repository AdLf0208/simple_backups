id = "simplebackups"
name = "Simple Backups"
version = "0.2.11"
description = """Scheduled, on-disk backups of the whole world, with retention. A backup saves the open
world, then a worker thread walks the world folder into a .zip.part, publishes it as a .zip and
prunes the oldest ones down to keep. A copy a save cycle overlapped is thrown away and redone. The
schedule is a game-tick interval or a wall-clock minute interval; the commands are
/simplebackups backup|status|list|pause|unpause|merge and /simplebackups adopt <file> at permission
level 2. Pause suppresses only the schedule and persists beside the world; a manual backup still
runs. The tick counter also persists beside the world, so a restart resumes the interval instead of
restarting it. With backup_type = "incremental" or "differential" the first backup is a full base
and later ones carry only changed files, with a manifest naming the base and the changed entries;
/simplebackups merge folds a chain into one standalone archive. Retention deletes only archives the
port marked itself, or a marker-less one an operator adopted. With noPlayerBackups=false (the
default) the schedule is silent while nobody is online; opting in allows noPlayerBackupCount backups
per empty period until a player joins, with that counter persisted beside the world. The game's
logs/latest.log is appended to every archive as a flat backup.log entry (capture_latest_log, default
true), from a path derived from the game's own directory with symlinks and out-of-root paths refused.
An empty period uses noPlayerBackupTimer minutes when set; 0 reuses the main interval (upstream's
default), a player online always uses the main interval, and /simplebackups status reports
timers=<configured> beside the other counters."""
authors = ["ChaoticTrials", "AdLf0208"]
license = "Apache-2.0"
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins,
# beside data/ and assets/. The id is the resource namespace and the only identity.
api = "0.2"
# "both" is the installation side, not the hook's: an integrated server belongs to the client
# installation, so single player and a LAN host need both. A dedicated server is "server".
side = "both"
# The one shared value every manifest carries ("May add blocks, items, mob effects and entity
# types"). Simple Backups registers nothing, and the manifest's shape is not negotiable.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
